name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.x"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check release package
        run: python tools/check_release.py
      - name: Smoke-test an isolated skill installation
        run: python tools/smoke_install.py
      - name: Test multi-agent installer
        run: python tools/test_installer.py
      - name: Run snapshot and save regressions
        run: python -B tools/test_regressions.py
      - name: Compile validator
        run: python -m py_compile skills/project-handoff/scripts/validate_handoff.py
      - name: Run validator self-tests
        run: python skills/project-handoff/scripts/validate_handoff.py --self-test
